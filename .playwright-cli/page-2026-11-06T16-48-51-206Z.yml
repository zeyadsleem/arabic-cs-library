        - generic [ref=f1e328]:
          - 'heading "الفصل 4: التجريد: العملية" [level=1] [ref=f1e329]'
          - paragraph [ref=f1e330]: "نتناول في هذا الفصل أحد أكثر التجريدات جذريةً التي يقدّمها نظام التشغيل للمستخدمين: العملية. تعريف العملية، بصيغة غير رسمية، بسيط للغاية: هي برنامج قيد التشغيل [V+65, BH70]. البرنامج نفسه شيء لا حياة فيه: يجلس ساكنًا على القرص، حزمة من التعليمات (وربما بعض البيانات الساكنة)، ينتظر لحظة الانطلاق. ونظام التشغيل هو من يأخذ هذه البايتات ويشغّلها، فيحوّل البرنامج إلى شيء نافع."
          - paragraph [ref=f1e331]: "يتبيّن أن المرء كثيرًا ما يرغب في تشغيل أكثر من برنامج في وقت واحد؛ تخيّل حاسوبك المكتبي أو المحمول حيث قد ترغب في تشغيل متصفّح ويب وبرنامج بريد ولعبة ومشغّل موسيقى وما إلى ذلك. بل إن النظام النمطي قد يشغّل ظاهريًا عشرات أو حتى مئات العمليات في اللحظة نفسها. وهذا ما يجعل النظام سهل الاستعمال، إذ لا يحتاج المرء إلى القلق بشأن توفّر معالج؛ بل يشغّل البرامج فحسب. ومن هنا يظهر تحدّينا:"
          - blockquote [ref=f1e332]:
            - paragraph [ref=f1e333]:
              - strong [ref=f1e334]: جوهر المسألة
            - paragraph [ref=f1e335]: كيف نقدّم وهمًا بعدد كبير من المعالجات؟ مع أن المعالجات المادية المتاحة قليلة فحسب، كيف يمكن لنظام التشغيل أن يوفّر الوهم بوجود إمداد شبه لا ينتهي منها؟
          - paragraph [ref=f1e336]: يصنع نظام التشغيل هذا الوهم عبر محاكاة المعالج افتراضيًا. فبتشغيل عملية ثم إيقافها وتشغيل أخرى وهكذا، يستطيع النظام تعزيز الوهم بوجود معالجات افتراضية كثيرة بينما لا يوجد في الحقيقة إلا معالج مادي واحد (أو عدد قليل). هذه التقنية الأساسية، المعروفة بالمشاركة الزمنية للمعالج، تتيح للمستخدمين تشغيل ما يشاؤون من العمليات المتزامنة؛ والكلفة المحتملة هي الأداء، إذ سيتباطأ كل منها إذا اضطرّت المعالجات إلى الاقتسام.
          - paragraph [ref=f1e337]: ولكي يحقّق نظام التشغيل محاكاة المعالج افتراضيًا، ويحقّقها جيدًا، سيحتاج إلى آليات منخفضة المستوى وإلى ذكاء عالي المستوى في آن واحد. ونسمّي الآليات منخفضة المستوى آليات؛ والآليات طرق أو بروتوكولات منخفضة المستوى تُنفّذ قطعة وظيفية مطلوبة. فمثلًا، سنتعلّم لاحقًا كيف ننفّذ تبديل السياق، وهو ما يمنح نظام التشغيل القدرة على إيقاف تشغيل برنامج والبدء في تشغيل آخر على معالج معيّن؛ وهذه الآلية القائمة على المشاركة الزمنية تعتمدها كل أنظمة التشغيل الحديثة.
          - paragraph [ref=f1e338]: المشاركة الزمنية تقنية أساسية يستعملها نظام التشغيل لاقتسام مورد ما. فبإتاحة استعمال المورد قليلًا لكيان ما، ثم قليلًا لكيان آخر، وهكذا، يمكن لكثيرين اقتسام المورد المعني (كالمعالج أو وصلة شبكة مثلًا). ونقيض المشاركة الزمنية هو المشاركة المكانية، حيث يُقسَّم المورد (مكانيًا) بين من يرغبون في استعماله. فمثلًا، مساحة القرص مورد مشترك مكانيًا بطبيعته؛ فحين تُخصَّص كتلة لملف، لا تُخصَّص عادةً لملف آخر حتى يحذف المستخدم الملف الأصلي.
          - blockquote [ref=f1e339]:
            - paragraph [ref=f1e340]:
              - strong [ref=f1e341]: "نصيحة: استخدم المشاركة الزمنية (والمشاركة المكانية)"
          - paragraph [ref=f1e342]: وفوق هذه الآليات يقبع بعض ذكاء نظام التشغيل في صورة سياسات. والسياسات خوارزميات تُتّخذ بها أنواع معيّنة من القرارات داخل النظام. فمثلًا، بالنظر إلى عدد من البرامج المرشّحة للتشغيل على معالج، أيّها ينبغي أن يشغّله النظام؟ ستتّخذ سياسة جدولة في النظام هذا القرار، مرجّحًا أن تستعمل معلومات تاريخية (أيّ البرامج شغّل وقتًا أطول في الدقيقة الأخيرة؟) ومعرفة بحمل العمل (أي أنواع البرامج تُشغَّل) ومقاييس أداء (هل يحسّن النظام الأداء التفاعلي أم معدّل الإنجاز؟) لتصل إلى قرارها.
          - paragraph [ref=f1e343]: في كثير من أنظمة التشغيل، من أنماط التصميم الشائعة فصل السياسات عالية المستوى عن آلياتها منخفضة المستوى [L+75]. يمكنك التفكير في الآلية بوصفها تقدّم جوابًا عن سؤال «كيف» يتعلّق بالنظام؛ فكيف يُجري نظام التشغيل تبديل السياق مثلًا؟ وتقدّم السياسة جوابًا عن سؤال «أيّ»؛ فأيّ عملية ينبغي أن يشغّلها نظام التشغيل الآن مثلًا؟ وفصل الاثنين يتيح تغيير السياسات بسهولة دون إعادة التفكير في الآلية، وهو بذلك ضرب من التمييز البنيوي، وهو مبدأ عام في تصميم البرمجيات.
          - blockquote [ref=f1e344]:
            - paragraph [ref=f1e345]:
              - strong [ref=f1e346]: "نصيحة: افصل السياسة عن الآلية"
          - 'heading "4.1 التجريد: العملية" [level=2] [ref=f1e347]'
          - paragraph [ref=f1e348]: التجريد الذي يقدّمه نظام التشغيل لبرنامج قيد التشغيل هو ما سنسمّيه عملية. وكما قلنا أعلاه، العملية ببساطة برنامج قيد التشغيل؛ وفي أي لحظة يمكننا تلخيص العملية بجرد القطع المختلفة من النظام التي تصل إليها أو تؤثّر فيها أثناء تنفيذها.
          - paragraph [ref=f1e349]: "ولفهم ما تتكوّن منه العملية، علينا إذن أن نفهم حالتها الآلية: ما الذي يمكن للبرنامج قراءته أو تحديثه وهو يعمل. وفي أي وقت، أي أجزاء الآلة مهمة لتنفيذ هذا البرنامج؟"
          - paragraph [ref=f1e350]: من المكوّنات الواضحة للحالة الآلية التي تتكوّن منها العملية ذاكرتها. فالتعليمات تقبع في الذاكرة؛ والبيانات التي يقرأها البرنامج الجاري ويكتبها تقبع في الذاكرة كذلك. ومن ثمّ فإن الذاكرة التي يمكن للعملية عنونتها (وتسمّى فضاء عناوينها) جزء من العملية.
          - paragraph [ref=f1e351]: ومن الحالة الآلية للعملية أيضًا السجلات؛ فتعليمات كثيرة تقرأ السجلات أو تحدّثها صراحةً، فلا ريب إذن في أنها مهمة لتنفيذ العملية.
          - paragraph [ref=f1e352]: لاحظ أن بعض السجلات الخاصة على وجه الخصوص تُشكّل جزءًا من هذه الحالة الآلية. فعدّاد البرنامج (PC) (ويسمّى أحيانًا مؤشّر التعليمات أو IP) يخبرنا أيّ تعليمة من البرنامج ستنفَّذ تاليًا؛ وعلى نحو مشابه يُستعمل مؤشّر المكدّس وإطار التنشيط المرتبط به لإدارة المكدّس من أجل وسائط الدوال والمتغيّرات المحلية وعناوين العودة.
          - paragraph [ref=f1e353]: وأخيرًا، كثيرًا ما تصل البرامج إلى أجهزة تخزين دائمة كذلك. وقد تشمل معلومات الإدخال/الإخراج هذه قائمة الملفات التي فتحتها العملية حاليًا.
          - heading "4.2 واجهة برمجة العملية" [level=2] [ref=f1e354]
          - paragraph [ref=f1e355]: وإن كنّا نؤجّل الحديث عن واجهة برمجة عملية حقيقية إلى فصل لاحق، فإننا نعطي هنا أولًا فكرة عمّا ينبغي أن تتضمّنه أي واجهة لنظام تشغيل. وهذه الواجهات، بشكل ما، متاحة على أي نظام تشغيل حديث.
          - list [ref=f1e356]:
            - listitem [ref=f1e357]:
              - paragraph [ref=f1e358]: "الإنشاء: يجب أن يتضمّن نظام التشغيل طريقة لإنشاء عمليات جديدة. فحين تكتب أمرًا في الصدفة، أو تنقر نقرًا مزدوجًا على أيقونة تطبيق، يُستدعى نظام التشغيل لإنشاء عملية جديدة لتشغيل البرنامج الذي أشرت إليه."
            - listitem [ref=f1e359]:
              - paragraph [ref=f1e360]: "الإنهاء: كما توجد واجهة لإنشاء العمليات، توفّر الأنظمة واجهة لإنهاء العمليات قسرًا. وكثير من العمليات ستعمل ثم تخرج من تلقاء نفسها عند الاكتمال بالطبع؛ لكن حين لا تفعل، قد يرغب المستخدم في قتلها، ومن ثمّ فإن واجهة لإيقاف عملية شاردة مفيدة جدًا."
            - listitem [ref=f1e361]:
              - paragraph [ref=f1e362]: "الانتظار: يكون الانتظار مفيدًا أحيانًا حتى تتوقّف عملية عن التشغيل؛ لذا تُوفَّر غالبًا واجهة انتظار من نوع ما."
            - listitem [ref=f1e363]:
              - paragraph [ref=f1e364]: "تحكّم متفرّق: عدا قتل العملية أو انتظارها، توجد أحيانًا تحكّمات أخرى ممكنة. فمعظم أنظمة التشغيل مثلًا توفّر طريقة لتعليق عملية (إيقاف تشغيلها مدة) ثم استئنافها (متابعة تشغيلها)."
            - listitem [ref=f1e365]:
              - paragraph [ref=f1e366]: "الحالة: توجد عادةً واجهات للحصول على بعض معلومات الحالة عن عملية ما كذلك، كالمدة التي شغّلت فيها أو الحالة التي هي عليها."
          - paragraph [ref=f1e367]:
            - img "الشكل 4.1" [ref=f1e368]
          - paragraph [ref=f1e369]:
            - strong [ref=f1e370]: "الشكل 4.1: التحميل: من البرنامج إلى العملية"
          - 'heading "4.3 إنشاء العملية: تفصيل إضافي صغير" [level=2] [ref=f1e371]'
          - paragraph [ref=f1e372]: من الألغاز التي يجدر بنا كشف بعضها كيف تتحوّل البرامج إلى عمليات. وتحديدًا، كيف يجعل نظام التشغيل برنامجًا يعمل؟ وكيف يعمل إنشاء العملية فعليًا؟
          - paragraph [ref=f1e373]: أول ما يجب أن يفعله نظام التشغيل لتشغيل برنامج هو تحميل شيفرته وأي بيانات ساكنة (كالمتغيّرات المهيّأة) إلى الذاكرة، إلى فضاء عناوين العملية. فالبرامج تقبع ابتداءً على القرص (أو، في بعض الأنظمة الحديثة، على أقراص الحالة الصلبة القائمة على الذاكرة الوميضية) في صيغة تنفيذية من نوع ما؛ ومن ثمّ فإن تحميل برنامج وبياناته الساكنة إلى الذاكرة يتطلّب من نظام التشغيل قراءة تلك البايتات من القرص ووضعها في الذاكرة في مكان ما (كما في الشكل 4.1).
          - paragraph [ref=f1e374]: في أنظمة التشغيل المبكّرة (أو البسيطة)، يُجرى التحميل بتلهّف، أي دفعةً واحدة قبل تشغيل البرنامج؛ أما الأنظمة الحديثة فتُجريه بكسل، أي بتحميل قطع الشيفرة أو البيانات فقط عند الحاجة إليها أثناء تنفيذ البرنامج. ولكي تفهم حقًا كيف يعمل التحميل الكسول لقطع الشيفرة والبيانات، ستحتاج إلى فهم أعمق لآلية الترقيم الصفحي والتبديل، وهو موضوع سنتناوله مستقبلًا حين نتحدّث عن محاكاة الذاكرة افتراضيًا. أما الآن فاكتفِ بتذكّر أنه قبل تشغيل أي شيء، يجب على نظام التشغيل بوضوح أن يقوم بعمل ما لنقل قطع البرنامج المهمة من القرص إلى الذاكرة.
          - paragraph [ref=f1e375]: وبعد تحميل الشيفرة والبيانات الساكنة إلى الذاكرة، تبقى بضعة أمور أخرى على نظام التشغيل إنجازها قبل تشغيل العملية. فيجب تخصيص بعض الذاكرة لمكدّس وقت التشغيل (أو المكدّس اختصارًا). وكما تعرف على الأرجح، تستعمل برامج C المكدّس للمتغيّرات المحلية ووسائط الدوال وعناوين العودة؛ ويخصّص نظام التشغيل هذه الذاكرة ويمنحها للعملية. وسيهيّئ النظام المكدّس أيضًا بالوسائط على الأرجح؛ وتحديدًا سيملأ وسائط الدالة main()، أي argc ومصفوفة argv.
          - paragraph [ref=f1e376]: وقد يخصّص نظام التشغيل كذلك بعض الذاكرة لكومة البرنامج. ففي برامج C تُستعمل الكومة للبيانات المخصّصة ديناميًا والتي تُطلب صراحةً؛ فتُطلب هذه المساحة باستدعاء malloc() وتُحرَّر صراحةً باستدعاء free(). والكومة لازمة لبنى بيانات كالقوائم المترابطة وجداول التجزئة والأشجار وغيرها من البنى الشيقة. وتكون الكومة صغيرة في البداية؛ ومع تشغيل البرنامج وطلبه مزيدًا من الذاكرة عبر واجهة مكتبة malloc()، قد يتدخّل نظام التشغيل ويخصّص للعملية مزيدًا من الذاكرة لمساعدتها على تلبية تلك الطلبات.
          - paragraph [ref=f1e377]: وسيؤدّي نظام التشغيل أيضًا بعض مهام التهيئة الأخرى، لا سيّما ما يتعلّق بالإدخال/الإخراج. ففي أنظمة UNIX مثلًا، لكل عملية افتراضيًا ثلاثة واصفات ملفات مفتوحة، للمدخل القياسي والمخرج القياسي والخطأ؛ وتتيح هذه الواصفات للبرامج قراءة المدخل من الطرفية بسهولة وطباعة المخرج على الشاشة. وسنتعلّم أكثر عن الإدخال/الإخراج وواصفات الملفات وما شابه في الجزء الثالث من الكتاب عن الاستمرارية.
          - paragraph [ref=f1e378]: "وبتحميل الشيفرة والبيانات الساكنة إلى الذاكرة، وإنشاء المكدّس وتهيئته، وأداء أعمال أخرى تتعلّق بإعداد الإدخال/الإخراج، يكون نظام التشغيل قد هيّأ المسرح لتنفيذ البرنامج (أخيرًا). وتبقى له مهمة أخيرة: أن يبدأ تشغيل البرنامج عند نقطة الدخول، أي main(). والقفز إلى روتين main() (عبر آلية متخصّصة سنتناولها في الفصل التالي) ينقل نظام التشغيل السيطرة على المعالج إلى العملية المنشأة حديثًا، فتبدأ العملية تنفيذها."
          - heading "4.4 حالات العملية" [level=2] [ref=f1e379]
          - paragraph [ref=f1e380]: "بعد أن صارت لدينا فكرة عن ماهية العملية (وإن كنا سنستمر في صقل هذا المفهوم)، وعن كيفية إنشائها (تقريبًا)، لنتحدّث عن الحالات المختلفة التي قد تكون عليها العملية في وقت معيّن. ففكرة أن تكون العملية في إحدى هذه الحالات نشأت في أنظمة الحاسوب المبكّرة [DV66, V+65]. وبنظرة مبسّطة، قد تكون العملية في إحدى ثلاث حالات:"
          - list [ref=f1e381]:
            - listitem [ref=f1e382]:
              - paragraph [ref=f1e383]: "قيد التشغيل: في حالة التشغيل، تكون العملية عاملة على معالج."
            - listitem [ref=f1e384]:
              - paragraph [ref=f1e385]: "جاهزة: في الحالة الجاهزة، تكون العملية مستعدّة للتشغيل، لكن نظام التشغيل اختار لسبب ما ألّا يشغّلها في هذه اللحظة."
            - listitem [ref=f1e386]:
              - paragraph [ref=f1e387]: "محجوبة: في الحالة المحجوبة، تكون العملية قد أجرت نوعًا من العمليات يجعلها غير مستعدّة للتشغيل حتى يقع حدث آخر. ومثال شائع: حين تبدأ عملية طلب إدخال/إخراج إلى قرص، تصبح محجوبة، فيستطيع نظام التشغيل إتاحة المعالج لعملية أخرى."
          - paragraph [ref=f1e388]: ولو رسمنا هذه الحالات على مخطّط، لبلغنا المخطّط في الشكل 4.2. وكما ترى في المخطّط، يمكن نقل العملية بين الحالتين الجاهزة وقيد التشغيل بتقدير نظام التشغيل. فالنقل من جاهزة إلى قيد التشغيل يعني أن العملية جُدولت؛ والنقل من قيد التشغيل إلى جاهزة يعني أن العملية أُخرجت من الجدولة. وحين تصبح العملية محجوبة (ببدء عملية إدخال/إخراج مثلًا)، يبقيها نظام التشغيل كذلك حتى يقع حدث ما (اكتمال الإدخال/الإخراج مثلًا)؛ وعندها تنتقل العملية إلى الحالة الجاهزة مجددًا (وربما إلى حالة التشغيل فورًا، إن قرّر النظام ذلك).
          - paragraph [ref=f1e389]: لننظر إلى مثال على كيفية انتقال عمليتين عبر بعض هذه الحالات. تخيّل أولًا عمليتين قيد التشغيل، كل منهما لا تستعمل إلا المعالج (ولا تجري إدخالًا/إخراج). في هذه الحالة قد يبدو أثر حالة كل عملية كما يلي (الشكل 4.3).
          - paragraph [ref=f1e390]:
            - img "الشكل 4.3" [ref=f1e391]
          - paragraph [ref=f1e392]:
            - strong [ref=f1e393]: "الشكل 4.3: تتبّع حالة العملية: المعالج فحسب"
          - paragraph [ref=f1e394]: في المثال التالي تبدأ العملية الأولى عملية إدخال/إخراج بعد التشغيل مدة. عندئذ تُحجب العملية، فتتاح للعملية الأخرى فرصة التشغيل. ويعرض الشكل 4.4 أثر هذا السيناريو.
          - paragraph [ref=f1e395]:
            - img "الشكل 4.4" [ref=f1e396]
          - paragraph [ref=f1e397]:
            - strong [ref=f1e398]: "الشكل 4.4: تتبّع حالة العملية: المعالج والإدخال/الإخراج"
          - paragraph [ref=f1e399]: وبتحديد أدقّ، تبدأ العملية الأولى إدخالًا/إخراجًا وتصبح محجوبة في انتظار اكتماله؛ وتُحجب العمليات مثلًا عند القراءة من قرص أو انتظار وصول حزمة من الشبكة. فيدرك نظام التشغيل أن العملية الأولى لا تستعمل المعالج فيبدأ تشغيل العملية الثانية. وبينما الثانية قيد التشغيل يكتمل الإدخال/الإخراج، فتعود الأولى إلى الحالة الجاهزة. وأخيرًا تنتهي الثانية، فتعمل الأولى ثم تنتهي.
          - paragraph [ref=f1e400]: لاحظ كثرة القرارات التي يجب على نظام التشغيل اتخاذها حتى في هذا المثال البسيط. أولًا، كان عليه أن يقرّر تشغيل العملية الثانية بينما بدأت الأولى إدخالًا/إخراجًا؛ وهذا يحسّن استغلال الموارد بإبقاء المعالج مشغولًا. ثانيًا، قرّر النظام ألّا يعود إلى العملية الأولى عند اكتمال إدخالها/إخراجها؛ وليس واضحًا إن كان هذا قرارًا صائبًا. ما رأيك؟ هذه الأنواع من القرارات يتّخذها مجدول نظام التشغيل، وهو موضوع سنتناوله بعد بضعة فصول.
          - paragraph [ref=f1e401]:
            - img "الشكل 4.2" [ref=f1e402]
          - paragraph [ref=f1e403]:
            - strong [ref=f1e404]: "الشكل 4.2: العملية: انتقالات الحالة"
          - heading "4.5 بنى البيانات" [level=2] [ref=f1e405]
          - paragraph [ref=f1e406]: نظام التشغيل برنامج، وكأي برنامج له بنى بيانات أساسية تتبّع قطع معلومات متصلة بالموضوع. فلتَتبّع حالة كل عملية مثلًا، يحتفظ نظام التشغيل على الأرجح بقائمة عمليات لكل العمليات الجاهزة، وبمعلومات إضافية لتتبّع العملية العاملة حاليًا. وعليه أيضًا أن يتتبّع العمليات المحجوبة بطريقة ما؛ فحين يكتمل حدث إدخال/إخراج، يجب أن يوقظ العملية الصحيحة ويجعلها جاهزة للتشغيل من جديد.
          - paragraph [ref=f1e407]: ويعرض الشكل 4.5 نوع المعلومات التي يحتاج نظام التشغيل إلى تتبّعها عن كل عملية في نواة xv6 [CK+08]. وتوجد بنى عمليات مشابهة في أنظمة تشغيل «حقيقية» مثل Linux وMac OS X وWindows؛ ابحث عنها وانظر كم هي أعقد من هذه.
          - paragraph [ref=f1e408]:
            - img "الشكل 4.5" [ref=f1e409]
          - paragraph [ref=f1e410]:
            - strong [ref=f1e411]: "الشكل 4.5: بنية proc في xv6"
          - paragraph [ref=f1e412]:
            - text: من الشكل ترى بضع قطع مهمة من المعلومات يتتبّعها نظام التشغيل عن العملية. فسياق السجلات يحفظ، حين تتوقّف عملية، محتويات سجلاتها. وعند إيقاف العملية تُحفظ سجلاتها في موقع الذاكرة هذا؛ وباستعادة هذه السجلات (أي بإعادة قيمها إلى السجلات المادية الفعلية) يستطيع نظام التشغيل متابعة تشغيل العملية. وسنتعلّم أكثر عن هذه التقنية، المعروفة بتبديل السياق، في فصول قادمة. وترى من الشكل أيضًا وجود حالات أخرى قد تكون عليها العملية عدا التشغيل والجاهزية والحجب. فبعض الأنظمة لها حالة ابتدائية تكون عليها العملية حين تُنشأ. وقد تُوضع العملية أيضًا في حالة نهائية حيث تكون قد خرجت لكنها لم تُنظَّف بعد (وفي الأنظمة المبنية على UNIX تسمّى هذه الحالة حالة الزومبي
            - superscript [ref=f1e413]:
              - link "[1]" [ref=f1e414] [cursor=pointer]:
                - /url: "#fn1"
            - text: ). وهذه الحالة النهائية مفيدة لأنها تتيح لعمليات أخرى (عادةً الأب الذي أنشأ العملية) فحص رمز العودة للعملية ومعرفة ما إذا كانت العملية المنتهية للتوّ قد نُفّذت بنجاح (عادةً تعيد البرامج صفرًا في الأنظمة المبنية على UNIX حين تنجز مهمة بنجاح، وغير صفر خلاف ذلك). وحين تنتهي، يجري الأب استدعاءً أخيرًا (مثل wait()) لينتظر اكتمال الابن، وليشير أيضًا إلى نظام التشغيل بأنه يستطيع تنظيف أي بنى بيانات تتعلّق بالعملية التي انقضت.
          - blockquote [ref=f1e415]:
            - paragraph [ref=f1e416]:
              - strong [ref=f1e417]: "استطراد: بنية البيانات — قائمة العمليات"
            - paragraph [ref=f1e418]: تعجّ أنظمة التشغيل ببنى بيانات مهمة سنتناولها في هذه المذكرات. وقائمة العمليات (وتسمّى أيضًا قائمة المهام) أول هذه البنى. وهي من أبسطها، لكن أي نظام تشغيل قادر على تشغيل برامج متعدّدة في وقت واحد سيكون فيه شيء شبيه بهذه البنية لتتبّع كل البرامج العاملة في النظام. ويشير الناس أحيانًا إلى البنية الفردية التي تخزّن معلومات عن عملية ما باسم كتلة تحكّم العملية (PCB)، وهي طريقة منمّقة للحديث عن بنية C تحتوي معلومات عن كل عملية (وتسمّى أحيانًا واصف العملية).
          - heading "4.6 الخلاصة" [level=2] [ref=f1e419]
          - paragraph [ref=f1e420]: "قدّمنا أكثر تجريدات نظام التشغيل أساسيةً: العملية. فهي ببساطة تُرى برنامجًا قيد التشغيل. وبهذه النظرة المفاهيمية في الذهن، ننتقل الآن إلى الجوهر: الآليات منخفضة المستوى اللازمة لتنفيذ العمليات، والسياسات عالية المستوى اللازمة لجدولتها على نحو ذكي. وبجمع الآليات والسياسات سنبني فهمنا لكيفية محاكاة نظام التشغيل للمعالج افتراضيًا."
          - blockquote [ref=f1e421]:
            - paragraph [ref=f1e422]:
              - strong [ref=f1e423]: "استطراد: مصطلحات العملية الأساسية"
            - list [ref=f1e424]:
              - listitem [ref=f1e425]:
                - paragraph [ref=f1e426]: "العملية هي تجريد نظام التشغيل الرئيسي لبرنامج قيد التشغيل. وفي أي لحظة يمكن وصف العملية بحالتها: محتويات الذاكرة في فضاء عناوينها، ومحتويات سجلات المعالج (ومنها عدّاد البرنامج ومؤشّر المكدّس وغيرهما)، ومعلومات عن الإدخال/الإخراج (كالملفات المفتوحة التي يمكن قراءتها أو الكتابة فيها)."
              - listitem [ref=f1e427]:
                - paragraph [ref=f1e428]: تتكوّن واجهة برمجة العملية من استدعاءات يمكن للبرامج إجراؤها فيما يتعلّق بالعمليات. ويشمل ذلك عادةً الإنشاء والإنهاء واستدعاءات نافعة أخرى.
              - listitem [ref=f1e429]:
                - paragraph [ref=f1e430]: توجد العمليات في إحدى حالات كثيرة مختلفة، منها قيد التشغيل وجاهزة للتشغيل ومحجوبة. وأحداث مختلفة (كجدولتها أو إخراجها من الجدولة، أو انتظار اكتمال إدخال/إخراج) تنقل العملية من حالة إلى أخرى.
              - listitem [ref=f1e431]:
                - paragraph [ref=f1e432]: تحتوي قائمة العمليات على معلومات عن كل العمليات في النظام. ويوجد كل مدخل في ما يسمّى أحيانًا كتلة تحكّم العملية (PCB)، وهي في الحقيقة مجرّد بنية تحتوي معلومات عن عملية بعينها.
          - heading "المراجع" [level=2] [ref=f1e433]
          - blockquote [ref=f1e434]:
            - paragraph [ref=f1e435]: "[BH70] «The Nucleus of a Multiprogramming System» لبير برنك هانسن. Communications of the ACM، المجلد 13:4، أبريل 1970. تقدّم هذه الورقة واحدة من أولى النوى المصغّرة في تاريخ أنظمة التشغيل، وتسمّى Nucleus. وفكرة الأنظمة الأصغر والأكثر بساطة موضوع يتكرّر ظهوره في تاريخ أنظمة التشغيل؛ وقد بدأ كل شيء بعمل برنك هانسن الموصوف هنا."
          - blockquote [ref=f1e436]:
            - paragraph [ref=f1e437]: "[CK+08] «The xv6 Operating System» لراس كوكس وفرانس كاشوك وروبرت موريس ونيكولاي زلدوفيتش. من: https://github.com/mit-pdos/xv6-public. أنيس نظام تشغيل حقيقي وصغير في العالم. نزّله والعب به لتتعلّم المزيد عن تفاصيل كيفية عمل أنظمة التشغيل فعليًا. وقد استعملنا نسخة أقدم (2012-01-30-1-g1c41342)، لذا قد لا تطابق بعض الأمثلة في الكتاب أحدث ما في الشيفرة المصدرية."
          - blockquote [ref=f1e438]:
            - paragraph [ref=f1e439]: "[DV66] «Programming Semantics for Multiprogrammed Computations» لجاك ب. دينيس وإيرل ك. فان هورن. Communications of the ACM، المجلد 9، العدد 3، مارس 1966. عرّفت هذه الورقة كثيرًا من المصطلحات والمفاهيم المبكّرة المتعلّقة ببناء الأنظمة متعدّدة البرامج."
          - blockquote [ref=f1e440]:
            - paragraph [ref=f1e441]: "[L+75] «Policy/mechanism separation in Hydra» لر. ليفين وإ. كوهين وو. كوروين وف. بولاك وو. وولف. SOSP '75، أوستن، تكساس، نوفمبر 1975. ورقة مبكّرة عن كيفية بناء أنظمة التشغيل في نظام بحثي يعرف بـ Hydra. ومع أن Hydra لم تصبح نظامًا سائدًا، فقد أثّرت بعض أفكارها في مصمّمي أنظمة التشغيل."
          - blockquote [ref=f1e442]:
            - paragraph [ref=f1e443]: "[V+65] «Structure of the Multics Supervisor» لف. أ. ڤيسوتسكي وف. ج. كورباتو ور. م. غراهام. مؤتمر الحاسوب المشترك الخريفي، 1965. ورقة مبكّرة عن Multics وصفت كثيرًا من الأفكار والمصطلحات الأساسية التي نجدها في الأنظمة الحديثة. وبعض الرؤى وراء الحوسبة كخدمة مرفقية تتحقّق أخيرًا في أنظمة السحابة الحديثة."
          - heading "الواجبات المنزلية (محاكاة)" [level=2] [ref=f1e444]
          - paragraph [ref=f1e445]: يتيح لك هذا البرنامج، process-run.py، أن ترى كيف تتغيّر حالات العمليات مع تشغيل البرامج، سواء باستعمال المعالج (بأداء تعليمة جمع مثلًا) أو بالإدخال/الإخراج (بإرسال طلب إلى قرص والانتظار حتى يكتمل). راجع ملف README للتفاصيل.
          - heading "الأسئلة" [level=2] [ref=f1e446]
          - list [ref=f1e447]:
            - listitem [ref=f1e448]:
              - paragraph [ref=f1e449]: "شغّل process-run.py بالخيارات التالية: -l 5:100,5:100. كم ينبغي أن يكون استغلال المعالج (أي النسبة المئوية من الزمن التي يكون فيها المعالج مستعملًا)؟ ولماذا تعرف ذلك؟ استعمل الخيارين -c و-p لترى إن كنت محقًا."
            - listitem [ref=f1e450]:
              - paragraph [ref=f1e451]: "شغّل الآن بالخيارات: ./process-run.py -l 4:100,1:0. تحدّد هذه الخيارات عملية بأربع تعليمات (كلها تستعمل المعالج)، وأخرى تجري إدخالًا/إخراجًا فحسب وتنتظر اكتماله. كم يستغرق إكمال العمليتين؟ استعمل -c و-p لتعرف إن كنت محقًا."
            - listitem [ref=f1e452]:
              - paragraph [ref=f1e453]: "اقلب ترتيب العمليتين: -l 1:0,4:100. ماذا يحدث الآن؟ وهل يهمّ قلب الترتيب؟ ولماذا؟ (وكالعادة، استعمل -c و-p لترى إن كنت محقًا.)"
            - listitem [ref=f1e454]:
              - paragraph [ref=f1e455]: سنستكشف الآن بعض الخيارات الأخرى. من الخيارات المهمة -S، وهو يحدّد كيف يتفاعل النظام حين تجري عملية إدخالًا/إخراجًا. فحين يُضبط على SWITCH ON END، لن ينتقل النظام إلى عملية أخرى بينما تجري عملية إدخالًا/إخراجًا، بل ينتظر حتى تنتهي العملية تمامًا. ماذا يحدث حين تشغّل العمليتين التاليتين (-l 1:0,4:100 -c -S SWITCH ON END)، إحداهما تجري إدخالًا/إخراجًا والأخرى تعمل على المعالج؟
            - listitem [ref=f1e456]:
              - paragraph [ref=f1e457]: شغّل العمليتين نفسيهما الآن، لكن مع ضبط سلوك التبديل على الانتقال إلى عملية أخرى متى كانت إحداهما تنتظر الإدخال/الإخراج (-l 1:0,4:100 -c -S SWITCH ON IO). ماذا يحدث الآن؟ استعمل -c و-p لتتأكّد من صحّة جوابك.
            - listitem [ref=f1e458]:
              - paragraph [ref=f1e459]: من السلوكيات المهمة الأخرى ما يُفعل عند اكتمال إدخال/إخراج. فمع -I IO RUN LATER، حين يكتمل إدخال/إخراج، لا تُشغَّل العملية التي أجرته بالضرورة فورًا؛ بل يستمر ما كان يعمل حينها في العمل. ماذا يحدث حين تشغّل هذه المجموعة من العمليات؟ (./process-run.py -l 3:0,5:100,5:100,5:100 -S SWITCH ON IO -c -p -I IO RUN LATER) وهل تُستغل موارد النظام استغلالًا فعّالًا؟
            - listitem [ref=f1e460]:
              - paragraph [ref=f1e461]: شغّل العمليات نفسها الآن مع ضبط -I IO RUN IMMEDIATE، الذي يشغّل فورًا العملية التي أجرت الإدخال/الإخراج. كيف يختلف هذا السلوك؟ ولماذا قد يكون تشغيل عملية أكملت للتوّ إدخالًا/إخراجًا فكرةً جيدة؟
            - listitem [ref=f1e462]:
              - paragraph [ref=f1e463]: شغّل الآن عمليات مولَّدة عشوائيًا بالخيارات -s 1 -l 3:50,3:50 أو -s 2 -l 3:50,3:50 أو -s 3 -l 3:50,3:50. انظر إن كنت تستطيع التنبّؤ بكيفية سير الأثر. وماذا يحدث حين تستعمل الخيار -I IO RUN IMMEDIATE بدل -I IO RUN LATER؟ وماذا يحدث حين تستعمل -S SWITCH ON IO بدل -S SWITCH ON END؟
