name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Rebuild the committed content artifacts
        run: pnpm content

      - name: The committed artifacts must match what the generators produce
        run: git diff --exit-code -- content/frontend-architecture content/frontend-architecture-structure.json src/lib/generated src/lib/tour

      - name: Audit the rendered sections
        run: pnpm audit:content

      - name: Content tests
        run: pnpm test:content

      - name: Build the site
        run: pnpm build

      - name: Every internal link in the built site must resolve
        run: pnpm check:links

      - name: Publish the checked production build to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
          enable_jekyll: false
